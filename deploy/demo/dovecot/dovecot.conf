# Restow public demo — Dovecot IMAP for the synthetic mailboxes only.
#
# Plain IMAP (no TLS): the demo network has no internet route and is never
# reached from outside the compose project (deploy/demo/README.md), so there
# is nothing to protect the wire against here. IMAP_ALLOW_INSECURE=true and
# IMAP_ALLOW_PRIVATE_NETWORKS=true on the api/worker match this on the Restow
# side (deploy/demo/docker-compose.yml).

protocols = imap
listen = *

disable_plaintext_auth = no
ssl = no

# One Maildir tree per domain/login; the seed's mail generator
# (deploy/demo/seed/src/maildir.ts) writes directly into the same layout.
mail_location = maildir:/var/mail/vhosts/%d/%n

namespace inbox {
  inbox = yes
}

# Accounts are provisioned at container start (docker-entrypoint.sh) into
# this file; never committed, never baked into the image.
passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}

userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/var/mail/vhosts/%d/%n
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

first_valid_uid = 1000
first_valid_gid = 1000

log_path = /dev/stdout
info_log_path = /dev/stdout
