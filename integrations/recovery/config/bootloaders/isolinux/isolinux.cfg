serial 0 115200
# SPDX-License-Identifier: GPL-3.0-or-later
#
# The BIOS boot configuration of the recovery ISO (syslinux). It replaces live-build's own,
# which ends with "timeout 0": after the included menus that waits for a key forever, so an
# unattended BIOS boot (answers on fw_cfg or a RESTOWANS medium, the recovery lab) never
# started. Like the GRUB menus it starts the entry marked "menu default" (Restow Recovery)
# after 10 seconds. The serial line comes first, as syslinux wants it.
include menu.cfg
default vesamenu.c32
prompt 0
timeout 100
