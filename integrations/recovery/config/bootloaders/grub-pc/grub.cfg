#
# The boot menu of the recovery ISO (README.md, "Start and Secure Boot"). The entries
# are in English: the menu comes before any language choice. Every entry starts the
# same live system; the kernel parameters keep connected disks inactive (noswap,
# nopersistence) and leave out the GPU drivers that would need firmware the image
# does not have. restow.keymap= picks the keyboard layout, restow.console= the serial
# console, restow.answers=media the unattended mode. live-build fills in the
# placeholders @KERNEL_LIVE@, @INITRD_LIVE@ and @APPEND_LIVE@.
#
# grub-pc/grub.cfg and grub-efi/grub.cfg are the same file (test/unit.sh checks it).

set default=0
set timeout=10
set timeout_style=menu

# The menu on the first serial port too (iDRAC, iLO and SOL consoles); the entry
# "Show this menu on ttyS1" moves it to the second.
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output gfxterm serial

insmod all_video
insmod gfxterm
menuentry "Restow Recovery" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ noswap nopersistence live-media-timeout=30 modprobe.blacklist=amdgpu,radeon,nouveau,xe restow.keymap=us
	initrd @INITRD_LIVE@
}
menuentry "Restow Recovery (serial console ttyS0, 115200)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ noswap nopersistence live-media-timeout=30 modprobe.blacklist=amdgpu,radeon,nouveau,xe console=tty0 console=ttyS0,115200n8 restow.console=ttyS0 restow.keymap=us
	initrd @INITRD_LIVE@
}
menuentry "Restow Recovery (serial console ttyS1, 115200)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ noswap nopersistence live-media-timeout=30 modprobe.blacklist=amdgpu,radeon,nouveau,xe console=tty0 console=ttyS1,115200n8 restow.console=ttyS1 restow.keymap=us
	initrd @INITRD_LIVE@
