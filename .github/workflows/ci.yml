name: CI

# Every push to a branch and every pull request; the release workflow calls it
# too, so a tag can only be released when the same checks pass on its commit.
# Pin policy: every third-party action is pinned to a full commit SHA with its
# version in a comment; every container image a step runs is pinned by digest.

on:
  push:
    # Dependabot branches are covered by their pull_request run; a push run on top
    # would run the whole CI a second time for the same commit.
    branches-ignore: ["dependabot/**"]
  pull_request:
  workflow_call:
  # By hand only: write the recovery ISO's packages.lock anew from its snapshot
  # (integrations/recovery/build.sh --update-lock); the job recovery-iso keeps the new
  # lock as an artifact, and the maintainer commits it after reviewing the diff.
  workflow_dispatch:
    inputs:
      update-lock:
        description: "Write integrations/recovery/packages.lock anew (recovery-iso keeps it as an artifact)"
        type: boolean
        required: false
        default: false

# Cancel superseded runs on the same ref to save CI minutes. When the release
# workflow calls this file, github.workflow is "Release", so the group never
# collides with a push run of CI itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.24.3@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
  ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667

jobs:
  lint:
    name: Lint (biome, ee boundary)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        # Reads the pinned version from package.json (packageManager).
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (biome), ee/ import direction, the former product name, shipped test files and the claims register
        # biome check over the whole repository, then scripts/ci/check-ee-boundary.mjs
        # (the core never imports from ee/), the former-name guard (no tracked file
        # or path names the product before its rename), check-package-files.mjs
        # (no test file or test data in the packages `pnpm deploy` copies into the image),
        # check-separate-works.mjs and check-claims.mjs: every claim of docs/CLAIMS.md
        # names a test that carries its ID, and no test carries an ID the register does
        # not know. Claims the product does not keep (parked with it.fails) and claims
        # without a test are printed as warnings with their count.
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the library packages (consumers resolve their types from dist)
        run: pnpm build:libs

      - name: Typecheck every workspace
        run: pnpm -r typecheck

  test:
    name: Unit and Postgres tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The bare metal stage 1 suite (apps/worker baremetal-check.pg.test.ts) runs the real
    # restore planner: the linux-amd64 agent the agent job built (docs/BAREMETAL.md 21.2).
    needs: agent

    # The Postgres suites (docs/TESTING.md) need a real server and a superuser:
    # every suite creates its own scratch database, and the Row Level Security
    # suites create and drop login roles.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: restow
          # Throwaway password of a database that lives only as long as this job.
          POSTGRES_PASSWORD: restow-ci
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username restow --dbname postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      RESTOW_TEST_DATABASE_URL: postgres://restow:restow-ci@localhost:5432/postgres

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned restic (the endpoint tests run it)
        # agent/tools.env pins the version and the SHA-256; the endpoint suites of
        # apps/api and apps/worker start restic, and the Postgres guard below
        # refuses a suite that skipped itself for lack of it.
        run: sh scripts/ci/install-restic.sh

      - name: Download the restore planner (the agent of the agent job)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-linux-amd64
          path: ${{ runner.temp }}/planner

      - name: Point the stage 1 suite at the planner
        # Without RESTOW_PLANNER_BIN the suite fails instead of skipping itself.
        run: |
          chmod +x "$RUNNER_TEMP/planner/restow-agent"
          echo "RESTOW_PLANNER_BIN=$RUNNER_TEMP/planner/restow-agent" >> "$GITHUB_ENV"

      - name: Self-test the CI and release tooling
        # The Postgres suite guard, the edge header checker, the ee/ import guard,
        # the former-name guard, the claims guard (which also runs against the real
        # register here), the license check, the release gate (every
        # scripts/ci/*.test.mjs) and the smoke's own helpers.
        run: >-
          node --test
          scripts/ci/*.test.mjs
          scripts/smoke/run.test.mjs
          scripts/smoke/lib/*.test.mjs
          scripts/recovery-e2e/run.test.mjs

      - name: Test
        # Root script builds the library packages first (consumers resolve their
        # runtime entry from dist), then runs every workspace's vitest suite,
        # Postgres suites included. Each workspace also writes a JSON report to
        # test-results/vitest.json for the guard below.
        run: pnpm test:ci

      - name: Assert no Postgres suite was skipped
        # A suite without RESTOW_TEST_DATABASE_URL skips itself and still looks
        # green; this fails the job unless every Postgres test ran and passed.
        run: pnpm test:pg-guard

  i18n:
    name: i18n completeness (de and en)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @restow/i18n...

      - name: Every key of en exists in de and the other way round
        # packages/i18n/src/keys.test.ts compares the key sets of every
        # namespace in both languages; no-em-dash.test.ts and icu.test.ts guard
        # the wording and the message syntax.
        run: pnpm --filter @restow/i18n test

  build:
    name: Build (all packages, web bundle)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

  docker:
    name: Docker image build, full and Community (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Self-test the build scripts (strip-ee, the image tree check, the entrypoint)
        # scripts/docker/strip-ee.mjs turns the workspace into the Community build (it
        # fails when a loader is missing), check-image-tree.mjs is the check the
        # Dockerfile and the release smoke run on the images (docs/CI.md), and
        # entrypoint.test.mjs runs the entrypoint the Dockerfile writes: the licence
        # start check comes before the migrations (docs/CLAIMS.md, LICENSE-004).
        run: node --test scripts/docker/*.test.mjs

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the application image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: restow:ci
          build-args: |
            RESTOW_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,scope=ci-app,mode=max

      - name: Build the web edge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web
          push: false
          load: true
          tags: restow-web:ci
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,scope=ci-app,mode=max

      - name: Build the Community application image (the core without ee/)
        # The Dockerfile strips ee/ before the build and stops when any ee/ code
        # reaches /prod or the web bundle.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-community
          push: false
          load: true
          tags: restow-community:ci
          build-args: |
            RESTOW_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,scope=ci-app,mode=max

      - name: Build the Community web edge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: web-community
          push: false
          load: true
          tags: restow-web-community:ci
          cache-from: type=gha,scope=ci-app
          cache-to: type=gha,scope=ci-app,mode=max

      - name: The images carry their tools
        # restic and the standalone restore tool must be in both application images, the
        # agent binaries with their checksums must sit where the api serves them from
        # (when agent/ exists in this commit).
        run: |
          for image in restow:ci restow-community:ci; do
            docker run --rm --entrypoint restow-restore "$image" --help > /dev/null
            if [ -f agent/go.mod ]; then
              docker run --rm --entrypoint restic "$image" version
              docker run --rm --entrypoint sh "$image" -c \
                'set -eu; for d in /srv/agent/*/*/; do (cd "$d" && sha256sum -c SHA256SUMS); done; ls /srv/agent/install'
            else
              echo "::notice::agent/ does not exist in this commit; the agent binaries are not checked."
            fi
          done

      - name: Every image carries the license texts
        # LICENSE, NOTICE, THIRD_PARTY_NOTICES.md and licenses/* in /usr/share/doc/restow of
        # all four images, ee/LICENSE (as ee-LICENSE) only in the two full images, and the
        # notices as text for the browser in both web images.
        run: |
          set -eu
          for image in restow:ci restow-community:ci restow-web:ci restow-web-community:ci; do
            docker run --rm --entrypoint sh "$image" -c \
              'set -eu; for f in LICENSE NOTICE THIRD_PARTY_NOTICES.md restic-LICENSE go-LICENSE msgreader-LICENSE shadcn-ui-LICENSE; do test -s "/usr/share/doc/restow/$f" || { echo "$f is missing" >&2; exit 1; }; done'
          done
          for image in restow:ci restow-web:ci; do
            docker run --rm --entrypoint test "$image" -s /usr/share/doc/restow/ee-LICENSE
          done
          for image in restow-community:ci restow-web-community:ci; do
            if docker run --rm --entrypoint test "$image" -e /usr/share/doc/restow/ee-LICENSE; then
              echo "::error::$image carries ee-LICENSE but holds no ee/ code"
              exit 1
            fi
          done
          for image in restow-web:ci restow-web-community:ci; do
            docker run --rm --entrypoint test "$image" -s /srv/licenses/THIRD_PARTY_NOTICES.txt
          done

      - name: No @tutao/oxmsg in the images, and the import folder exists
        # @tutao/oxmsg is a devDependency (license ambiguous: MIT or GPL-3.0); the
        # production install (pnpm deploy --prod) must never carry it.
        run: |
          for image in restow:ci restow-community:ci; do
            docker run --rm --entrypoint sh "$image" -c \
              'set -eu; if find /prod \( -path "*/@tutao/*" -o -name "oxmsg*" \) | grep -q .; then echo "@tutao/oxmsg is in the image" >&2; exit 1; fi; test -d /var/lib/restow/import'
          done

      - name: The OCI labels are set, with the license of each build, and the variant marker
        run: |
          set -eu
          check_labels() {
            image="$1"
            expected="$2"
            docker image inspect "$image" --format '{{json .Config.Labels}}' | tee labels.json
            echo
            for key in title description source licenses revision; do
              grep -q "org.opencontainers.image.$key" labels.json \
                || { echo "::error::$image: missing OCI label $key"; exit 1; }
            done
            licenses="$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}')"
            if [ "$licenses" != "$expected" ]; then
              echo "::error::$image is labelled licenses=\"$licenses\", expected \"$expected\""
              exit 1
            fi
          }
          check_labels restow:ci "Apache-2.0 AND LicenseRef-Restow-Enterprise"
          check_labels restow-web:ci "Apache-2.0 AND LicenseRef-Restow-Enterprise"
          check_labels restow-community:ci "Apache-2.0"
          check_labels restow-web-community:ci "Apache-2.0"
          env_of() { docker image inspect "$1" --format '{{range .Config.Env}}{{println .}}{{end}}'; }
          env_of restow:ci | grep -qx 'RESTOW_IMAGE_VARIANT=full' \
            || { echo "::error::restow:ci does not say RESTOW_IMAGE_VARIANT=full"; exit 1; }
          env_of restow-community:ci | grep -qx 'RESTOW_IMAGE_VARIANT=community' \
            || { echo "::error::restow-community:ci does not say RESTOW_IMAGE_VARIANT=community"; exit 1; }
          for image in restow:ci restow-community:ci; do
            env_of "$image" | grep -qx "RESTOW_REVISION=$GITHUB_SHA" \
              || { echo "::error::$image does not carry RESTOW_REVISION=$GITHUB_SHA"; exit 1; }
          done

      - name: No ee/ code in the Community images, no license signing code in any image
        # scripts/docker/check-image-tree.mjs, the same check the Dockerfile runs while
        # building and the release smoke runs on the published images (docs/CI.md):
        # the full images carry the ee/ modules in the api and the worker, the
        # Community images none of ee/, and no image carries license signing code.
        run: |
          set -eu
          tree() {
            image="$1"
            shift
            docker run --rm --network none -v "$PWD/scripts/docker:/check:ro" \
              --entrypoint node "$image" /check/check-image-tree.mjs "$@"
          }
          tree restow:ci --variant full /prod
          tree restow:ci --variant full --require-ee /prod/api /prod/worker
          tree restow-community:ci --variant community /prod
          for pair in restow-web:ci:full restow-web-community:ci:community; do
            image="${pair%:*}"
            variant="${pair##*:}"
            container="$(docker create "$image")"
            rm -rf "$RUNNER_TEMP/srv"
            docker cp "$container:/srv" "$RUNNER_TEMP/srv"
            docker rm "$container" > /dev/null
            node scripts/docker/check-image-tree.mjs --variant "$variant" "$RUNNER_TEMP/srv"
          done

  audit:
    name: Dependency audit (high, critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Audit dependencies (fails on high or critical advisories)
        # Reads pnpm-lock.yaml against the npm advisory database; no install
        # needed. The release smoke check allows no high or critical advisory.
        run: pnpm audit --audit-level high

  licenses:
    name: Dependency licenses
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency licenses (allowlist, no copyleft in ee/)
        # Every production dependency against the allowlist in
        # scripts/ci/license-policy.json: fails on GPL, LGPL, AGPL, SSPL, EUPL and on
        # any license the policy does not know, with the list of packages. The
        # dependencies of the ee/ workspaces must also be free of any copyleft (MPL
        # is not allowed there), and the license field of every package.json is
        # checked (Apache-2.0 for the core, ee/LICENSE for ee/).
        run: node scripts/ci/check-licenses.mjs

      - name: Set up Go (for the agent's module check)
        # Older commits have no agent/ folder; the check then has nothing to do.
        if: hashFiles('agent/go.mod') != ''
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: The Go agent has no third-party Go modules
        # `go list` over the module graph and the packages of all four targets;
        # fails as soon as agent/ depends on a module other than its own.
        run: node scripts/ci/check-go-deps.mjs

      - name: Separate works stay separate (PVE plugin shim, AGPL-3.0-or-later)
        # scripts/ci/check-separate-works.mjs: integrations/pve/plugin carries its
        # license and SPDX headers, holds no core code, is referenced only where
        # license-policy.json allows and copied nowhere. Then the shim's own tests
        # (perl -c against stub base classes, a mock vzdump driving the provider).
        run: |
          node scripts/ci/check-separate-works.mjs
          prove integrations/pve/plugin/t/

      - name: Third-party notices are up to date
        # THIRD_PARTY_NOTICES.md carries name, version, license, copyright lines and the
        # license texts of every shipped dependency, read from the installed packages and,
        # for the Go modules compiled into restic, from licenses/restic-deps/. The same run
        # writes agent/THIRD_PARTY_NOTICES.txt, which ships with the agent to endpoints. The
        # generator's output is the same on macOS and Linux, so a diff means a committed
        # file is stale (run node scripts/third-party-notices.mjs and commit both).
        run: |
          node scripts/third-party-notices.mjs
          git diff --exit-code THIRD_PARTY_NOTICES.md agent/THIRD_PARTY_NOTICES.txt

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: gitleaks
        # The container image, pinned by digest (the GitHub action needs a paid
        # license for organisation repositories). Uses .gitleaks.toml. A pull
        # request is scanned over its own commits, every other run over the
        # whole history.
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          range=()
          if [ -n "$BASE_SHA" ]; then
            range=(--log-opts "$BASE_SHA..$HEAD_SHA")
          fi
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" detect --source /repo --config /repo/.gitleaks.toml \
            --redact --verbose --no-banner "${range[@]}"

  agent:
    name: Go agent (vet, test, cross-compile)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is there an agent in this commit?
        id: detect
        # Older commits have no agent/ folder; the job then passes and says so.
        run: |
          if [ -f agent/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::agent/ does not exist in this commit; nothing to check."
          fi

      - name: Set up Go
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          # The agent has no third-party Go dependencies and so no go.sum to key a cache on.
          cache: false

      - name: Static checks and unit tests (gofmt, go vet for the five targets, go test -race, ShellCheck)
        if: steps.detect.outputs.present == 'true'
        run: sh agent/scripts/test.sh

      - name: Integration tests (the agent against the real restic and an append-only REST server)
        if: steps.detect.outputs.present == 'true'
        run: sh agent/scripts/integration.sh

      - name: Install script test (linux.sh in a container, signature checks, enroll, repeat, tampered download, 0.1.0 move, uninstall)
        if: steps.detect.outputs.present == 'true'
        run: sh agent/scripts/test-install.sh

      - name: Cross-compile every target with restic (agent/build.sh)
        if: steps.detect.outputs.present == 'true'
        run: sh agent/build.sh --out "$RUNNER_TEMP/agent-dist"

      - name: Hand the linux-amd64 agent to the test job (the restore planner of stage 1)
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-linux-amd64
          path: ${{ runner.temp }}/agent-dist/linux-amd64/restow-agent
          if-no-files-found: error
          retention-days: 1

      - name: Hand the linux-amd64 build to the recovery ISO jobs (agent, restic, notices, sums)
        if: steps.detect.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-dist-linux-amd64
          path: |
            ${{ runner.temp }}/agent-dist/linux-amd64
            ${{ runner.temp }}/agent-dist/SHA256SUMS
            ${{ runner.temp }}/agent-dist/VERSION
            ${{ runner.temp }}/agent-dist/RESTIC_VERSION
          if-no-files-found: error
          retention-days: 3

      - name: The Go modules inside restic are the ones whose licenses are vendored
        # The build information of the five pinned restic binaries just fetched (restic.exe
        # for Windows) must list the modules, versions and hashes of
        # licenses/restic-deps/modules.json for their target, the source of the notices; a
        # new restic pin needs `node scripts/restic-licenses.mjs vendor` first. Reads the
        # binaries directly (no Go, no network).
        if: steps.detect.outputs.present == 'true' && hashFiles('scripts/restic-licenses.mjs') != ''
        run: node scripts/restic-licenses.mjs check "$RUNNER_TEMP"/agent-dist/*/restic*

      - name: restic.exe still prints the snapshot errors the agent recognises
        # The Windows agent learns that a shadow copy failed only from these texts in
        # restic's JSON output (restic still exits 0, docs/WINDOWS-AGENT.md, section 17.3).
        # A restic pin that changed them fails here, on Linux, whether or not VSS works
        # on the Windows runner.
        if: steps.detect.outputs.present == 'true'
        run: |
          exe="$RUNNER_TEMP/agent-dist/windows-amd64/restic.exe"
          [ -f "$exe" ] || { echo "::notice::no windows-amd64 build in this commit"; exit 0; }
          for text in 'failed to create snapshot for [' 'failed to delete VSS snapshot' \
            'Snapshots are not supported for volume' 'VSS error: '; do
            if ! grep -q -a -F -- "$text" "$exe"; then
              echo "::error::restic.exe no longer contains '$text'; check internal/restic/snapshot.go against the new restic"
              exit 1
            fi
          done
          echo "restic.exe contains all four snapshot error texts"

  agent-root:
    name: Go agent as root (file system snapshots and layout capture on loop devices)
    # docs/BAREMETAL.md 21.2: LVM (thick, thin, a full volume group), btrfs with nested
    # subvolumes, md, LUKS and XFS on loop devices, the snapshot helper's namespace and
    # chroot, restic through it against rest-server, and that nothing stays mounted. The
    # tests are behind the build tag agentroot and RESTOW_AGENT_ROOT=1, so they never run
    # elsewhere.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is there an agent with these tests in this commit?
        id: detect
        run: |
          if [ -f agent/go.mod ] && grep -rqs --include='*.go' 'agentroot' agent/internal; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no agent-root tests in this commit; nothing to run."
          fi

      - name: Set up Go
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: Storage tools
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lvm2 thin-provisioning-tools btrfs-progs mdadm cryptsetup xfsprogs dosfstools fdisk gdisk

      - name: restic and rest-server (pinned in agent/tools.env)
        if: steps.detect.outputs.present == 'true'
        env:
          AGENT_DIR: ${{ github.workspace }}/agent
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          . agent/scripts/lib.sh
          fetch_tool restic linux amd64 "$RUNNER_TEMP/tools/restic"
          fetch_tool rest-server linux amd64 "$RUNNER_TEMP/tools/rest-server"

      - name: Tests as root (build tag agentroot)
        if: steps.detect.outputs.present == 'true'
        working-directory: agent
        env:
          RESTIC_BINARY: ${{ runner.temp }}/tools/restic
          RESTOW_TEST_RESTIC: ${{ runner.temp }}/tools/restic
          RESTOW_TEST_REST_SERVER: ${{ runner.temp }}/tools/rest-server
        run: |
          go test -c -tags agentroot -o "$RUNNER_TEMP/fssnap.test" ./internal/fssnap
          go test -c -tags agentroot -o "$RUNNER_TEMP/baremetal.test" ./internal/baremetal
          # Each test binary runs in its package folder, where its testdata lies.
          cd internal/fssnap
          sudo -E env RESTOW_AGENT_ROOT=1 "PATH=$PATH" "$RUNNER_TEMP/fssnap.test" -test.v -test.count=1 -test.timeout=20m
          cd ../baremetal
          sudo -E env RESTOW_AGENT_ROOT=1 "PATH=$PATH" "$RUNNER_TEMP/baremetal.test" -test.v -test.count=1 -test.timeout=20m
          # restow-agent recover (docs/BAREMETAL.md 10.10 to 10.14): the isolation of the
          # programs of a backup, the executor on loop devices, holders, O_DIRECT probes.
          if grep -rqs --include='*_test.go' 'agentroot' ../recovery; then
            cd ..
            go test -c -tags agentroot -o "$RUNNER_TEMP/recovery.test" ./recovery
            cd recovery
            sudo -E env RESTOW_AGENT_ROOT=1 "PATH=$PATH" "$RUNNER_TEMP/recovery.test" -test.v -test.count=1 -test.timeout=20m
          fi
          # The backup through the snapshot helper in its own mount namespace: only root
          # may make one, so the unit tests of internal/core do not rely on it.
          if grep -rqs --include='*_test.go' 'agentroot' ../core; then
            cd ..
            go test -c -tags agentroot -o "$RUNNER_TEMP/core.test" ./core
            cd core
            sudo -E env RESTOW_AGENT_ROOT=1 "PATH=$PATH" "$RUNNER_TEMP/core.test" -test.v -test.count=1 -test.timeout=10m -test.run '^TestRoot'
          fi

  agent-windows:
    name: Go agent on Windows (vet, unit tests)
    # Windows preview (docs/WINDOWS-AGENT.md, section 3.5): the unit tests that have no
    # `unix` build tag run natively. Tests that use /bin/sh stand-ins for restic or the
    # agent carry `//go:build unix` and run in the job above. The service, Job Object,
    # DPAPI, ACL and hook tests carry the tag windowsintegration; the installer has its
    # own PowerShell test. The restic.exe integration tests join with the backup code.
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep LF line endings
        # The Windows runner checks out with core.autocrlf=true; gofmt would then list
        # every Go file.
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is there an agent in this commit?
        id: detect
        run: |
          if [ -f agent/go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::agent/ does not exist in this commit; nothing to check."
          fi

      - name: Set up Go
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: agent/go.mod
          cache: false

      - name: gofmt and go vet (native)
        if: steps.detect.outputs.present == 'true'
        working-directory: agent
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not formatted: $unformatted"
            exit 1
          fi
          go vet ./...

      - name: Unit tests (native, with the race detector when gcc is there)
        if: steps.detect.outputs.present == 'true'
        working-directory: agent
        run: |
          if command -v gcc >/dev/null 2>&1; then
            CGO_ENABLED=1 go test -race -count=1 ./...
          else
            echo "(gcc not found: running without the race detector)"
            CGO_ENABLED=0 go test -count=1 ./...
          fi

      - name: Windows integration tests (service, DPAPI, ACLs, Job Objects, hooks, junction sources)
        # docs/WINDOWS-AGENT.md, section 22.1. The hosted runner runs as an
        # administrator: the tests create and delete the service RestowAgentTest.
        if: steps.detect.outputs.present == 'true'
        working-directory: agent
        run: go test -count=1 -tags windowsintegration ./internal/state/ ./internal/paths/ ./internal/hooks/ ./internal/svc/ ./internal/procctl/ ./internal/core/ ./internal/update/

      - name: Installer tests (Ed25519 against Go, SSHSIG, full run against the fake instance)
        # Windows PowerShell 5.1, the version every supported Windows has. The
        # differential test compares the PowerShell Ed25519 check with crypto/ed25519.
        if: steps.detect.outputs.present == 'true'
        working-directory: agent
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/test-install-windows.ps1 -Vectors 300

  shellcheck:
    name: Shell scripts (shellcheck, server installer tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: shellcheck
        # shellcheck is part of the GitHub-hosted runner image. Covers the agent
        # installer (agent/install/*.sh), the server installer (deploy/install/install.sh)
        # and every other script in the repository.
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          echo "checking ${#scripts[@]} scripts"
          shellcheck --external-sources --source-path=SCRIPTDIR --severity=style "${scripts[@]}"

      - name: Server install script tests (deploy/install/test.sh)
        # Options, preflight decisions, the generated .env (secrets, mode 0600, never
        # overwritten, nothing in the log) and whole dry runs against stub commands. No
        # root, no Docker, no network; the VM tests are manual (docs/CI.md).
        run: bash deploy/install/test.sh

      - name: Demo reset script tests (deploy/demo/test.sh)
        # The default mode and the follow mode of deploy/demo/reset.sh against a stub
        # docker: what is pulled, that a failed pull or a mix of releases stops the
        # reset before anything is torn down, and what compose finally runs.
        run: bash deploy/demo/test.sh

  recovery-scripts:
    name: Recovery ISO scripts (self-tests, shellcheck of the hooks)
    # The build recipe of the recovery ISO (integrations/recovery, a separate GPL work):
    # its shell helpers, the refusals of build.sh, the boot menus and the package lists,
    # without root or Docker. The *.sh files are in the shellcheck job as well; the hooks
    # and auto/config have no .sh name and are checked here.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Is there a recovery ISO recipe in this commit?
        id: detect
        run: |
          if [ -f integrations/recovery/test/unit.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::integrations/recovery does not exist in this commit; nothing to check."
          fi

      - name: Self-tests (test/unit.sh)
        if: steps.detect.outputs.present == 'true'
        run: sh integrations/recovery/test/unit.sh

      - name: shellcheck of the hooks and auto/config
        if: steps.detect.outputs.present == 'true'
        run: >-
          shellcheck --external-sources --source-path=SCRIPTDIR --severity=style --shell=sh
          integrations/recovery/config/hooks/live/*.hook.chroot
          integrations/recovery/auto/config

  recovery-paths:
    name: Recovery ISO (does this change touch it?)
    # The ISO is built and tested again when its recipe, the agent or the end-to-end driver
    # changed, and always when the release workflow calls CI; otherwise the jobs below are
    # skipped, and the last build of an unchanged state stands (docs/CI.md).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Changed paths
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          UPDATE_LOCK: ${{ inputs.update-lock && 'true' || 'false' }}
        run: |
          set -euo pipefail
          if [ ! -f integrations/recovery/build.sh ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=""
          case "$EVENT" in
            pull_request) base="$BASE_SHA" ;;
            push) base="$BEFORE" ;;
          esac
          # Without the first packages.lock (written by hand with update-lock) there is nothing
          # to build: build.sh refuses an empty lock, and the release does too.
          entries="$(grep -cvE '^[[:space:]]*(#|$)' integrations/recovery/packages.lock || true)"
          if [ "$entries" = 0 ] && [ "$UPDATE_LOCK" != true ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::integrations/recovery/packages.lock has no entries yet; run this workflow by hand with update-lock and commit the lock it writes."
            exit 0
          fi
          if [ "$UPDATE_LOCK" = true ] || [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] ||
            ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # By hand, a call from the release workflow, a new branch, or an unknown base: build.
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=false
          if git diff --name-only "$base" HEAD |
            grep -qE '^(integrations/recovery/|agent/|scripts/recovery-e2e/|apps/api/src/features/endpoints/recovery)'; then
            changed=true
          else
            echo "::notice::nothing of the recovery ISO changed; its build, comparison and end-to-end tests are skipped."
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

  recovery-iso:
    name: Recovery ISO (build on ubuntu-24.04, image checks)
    # docs/BAREMETAL.md 8.3: live-build in the pinned debian:trixie container from the
    # snapshot of snapshot.env, with exactly the packages of packages.lock. No secrets: the
    # privileged build container gets only the build variables (build.sh --env-file).
    needs: [agent, recovery-paths]
    if: needs.recovery-paths.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The agent build of this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-dist-linux-amd64
          path: ${{ runner.temp }}/agent-dist

      - name: Build the ISO
        env:
          UPDATE_LOCK: ${{ inputs.update-lock && '--update-lock' || '' }}
        run: |
          set -euo pipefail
          chmod +x "$RUNNER_TEMP"/agent-dist/linux-amd64/restow-agent "$RUNNER_TEMP"/agent-dist/linux-amd64/restic
          version="$(cat "$RUNNER_TEMP/agent-dist/VERSION")"
          # shellcheck disable=SC2086 # empty or one flag
          sh integrations/recovery/build.sh --agent-dist "$RUNNER_TEMP/agent-dist/linux-amd64" \
            --version "$version" --out "$RUNNER_TEMP/recovery" $UPDATE_LOCK
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Keep the new packages.lock (update-lock)
        if: inputs.update-lock
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-packages-lock
          path: ${{ runner.temp }}/recovery/packages.lock
          if-no-files-found: error
          retention-days: 14

      - name: Image checks (firmware list, tools, version, boot entries, size, keymaps, no secrets)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools xorriso
          sudo sh integrations/recovery/test/check-image.sh "$RUNNER_TEMP/recovery/restow-recovery_${VERSION}_amd64.iso" "$VERSION"

      # docs/BAREMETAL.md 21.2 and the risk table (20): the started ISO activates nothing of an
      # old disk with an md RAID1, a volume group and swap (test/no-autoactivation.sh in QEMU).
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: No auto-activation in the started ISO (QEMU/KVM)
        run: |
          set -euo pipefail
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
          node scripts/recovery-e2e/no-autoactivation.mjs \
            --iso "$RUNNER_TEMP/recovery/restow-recovery_${VERSION}_amd64.iso" --work-dir "$RUNNER_TEMP/no-autoactivation"

      - name: Keep the serial logs of the auto-activation test
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-no-autoactivation-logs
          path: ${{ runner.temp }}/no-autoactivation/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Keep the ISO and its hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-iso
          path: |
            ${{ runner.temp }}/recovery/restow-recovery_*_amd64.iso
            ${{ runner.temp }}/recovery/restow-recovery_*_amd64.iso.sha256
            ${{ runner.temp }}/recovery/restow-recovery_*_FIRMWARE-LICENSES.txt
          if-no-files-found: error
          retention-days: 3

  recovery-iso-rebuild:
    name: Recovery ISO (second build on ubuntu-22.04, other TZ and umask)
    needs: [agent, recovery-paths]
    if: needs.recovery-paths.outputs.changed == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      # build.sh sets TZ, umask and the locale inside the container; the host differs on purpose.
      TZ: Pacific/Auckland
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The agent build of this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-dist-linux-amd64
          path: ${{ runner.temp }}/agent-dist

      - name: Build the ISO again
        env:
          UPDATE_LOCK: ${{ inputs.update-lock && '--update-lock' || '' }}
        run: |
          set -euo pipefail
          umask 077
          chmod +x "$RUNNER_TEMP"/agent-dist/linux-amd64/restow-agent "$RUNNER_TEMP"/agent-dist/linux-amd64/restic
          version="$(cat "$RUNNER_TEMP/agent-dist/VERSION")"
          # shellcheck disable=SC2086 # empty or one flag
          sh integrations/recovery/build.sh --agent-dist "$RUNNER_TEMP/agent-dist/linux-amd64" \
            --version "$version" --out "$RUNNER_TEMP/recovery" $UPDATE_LOCK

      - name: Keep the ISO and its hash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-iso-rebuild
          path: |
            ${{ runner.temp }}/recovery/restow-recovery_*_amd64.iso
            ${{ runner.temp }}/recovery/restow-recovery_*_amd64.iso.sha256
          if-no-files-found: error
          retention-days: 3

  recovery-iso-compare:
    name: Recovery ISO (both builds bit for bit equal)
    needs: [recovery-iso, recovery-iso-rebuild]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Both builds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: recovery-iso*
          path: builds

      - name: Compare the SHA-256 (diffoscope on a difference)
        run: |
          set -euo pipefail
          first="$(cut -d ' ' -f 1 builds/recovery-iso/*.iso.sha256)"
          second="$(cut -d ' ' -f 1 builds/recovery-iso-rebuild/*.iso.sha256)"
          echo "ubuntu-24.04: $first"
          echo "ubuntu-22.04: $second"
          if [ "$first" = "$second" ]; then
            echo "::notice::the recovery ISO builds reproducibly ($first)"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends diffoscope
          diffoscope --max-report-size 20000000 --text diffoscope.txt \
            builds/recovery-iso/*.iso builds/recovery-iso-rebuild/*.iso || true
          head -n 400 diffoscope.txt
          echo "::error::the two builds of the recovery ISO differ; see diffoscope above"
          exit 1

  recovery-e2e:
    name: Recovery end to end (E1, E2 in QEMU/KVM)
    # docs/BAREMETAL.md 21.2: a source machine is backed up, restored by the ISO onto other
    # hardware through the recovery API and must boot. KVM through a udev rule; without
    # it the driver stops with a clear message (TCG would take hours).
    needs: [agent, recovery-iso, recovery-paths]
    if: needs.recovery-paths.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: QEMU, OVMF and the firmware variable tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf \
            python3-virt-firmware xorriso openssh-client

      - name: The agent build and the ISO of this commit
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{agent-dist-linux-amd64,recovery-iso}"
          path: ${{ runner.temp }}/artifacts

      - name: E1 and E2
        run: |
          set -euo pipefail
          iso="$(ls "$RUNNER_TEMP"/artifacts/recovery-iso/restow-recovery_*_amd64.iso)"
          node scripts/recovery-e2e/run.mjs --iso "$iso" --agent-dist "$RUNNER_TEMP/artifacts/agent-dist-linux-amd64" \
            --cases per-pr --work-dir "$RUNNER_TEMP/recovery-e2e"

      - name: Keep the serial logs and the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: recovery-e2e-logs
          path: |
            ${{ runner.temp }}/recovery-e2e/report.json
            ${{ runner.temp }}/recovery-e2e/*/*.log
          if-no-files-found: ignore
          retention-days: 7

  actionlint:
    name: Workflows (actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint
        # The container image includes shellcheck and pyflakes for the run: steps.
        run: docker run --rm -v "$PWD:/repo" -w /repo "$ACTIONLINT_IMAGE" -color

  passed:
    name: CI passed
    # One check to require in the branch protection rule instead of a dozen. It
    # fails when any job above failed or was cancelled.
    if: always()
    needs:
      - lint
      - typecheck
      - test
      - i18n
      - build
      - docker
      - audit
      - licenses
      - secrets
      - agent
      - agent-root
      - agent-windows
      - shellcheck
      - actionlint
      - recovery-scripts
      - recovery-paths
      - recovery-iso
      - recovery-iso-rebuild
      - recovery-iso-compare
      - recovery-e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every job succeeded
        # The recovery ISO jobs are skipped when nothing of the ISO changed (recovery-paths);
        # a skipped one counts as passed, every other job has to succeed.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results.txt
          cat results.txt
          failed=0
          while read -r job result; do
            case "$job:$result" in
              *:success) ;;
              recovery-iso:skipped | recovery-iso-rebuild:skipped | recovery-iso-compare:skipped | recovery-e2e:skipped) ;;
              *) echo "::error::$job: $result"; failed=1 ;;
            esac
          done < results.txt
          exit "$failed"
