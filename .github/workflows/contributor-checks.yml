name: Contributor checks

# The Contributor License Agreement (CLA.md) and the Developer Certificate of
# Origin sign-off (CONTRIBUTING.md) for every pull request.
#
# The CLA job runs on `pull_request_target` so it can comment on and set a
# status for pull requests from forks. It never checks out or runs code from
# the pull request; it only reads comments and writes the signature file to
# the `cla-signatures` branch of this repository. No external service and no
# personal access token are involved.

on:
  pull_request:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  cla:
    name: Contributor License Agreement
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      startsWith(github.event.comment.body, 'I have read the Restow Contributor License Agreement, version 1.0')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    steps:
      - name: Check the CLA signatures
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/restow-backup/restow/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: lcsfls,dependabot[bot],renovate[bot]
          custom-notsigned-prcomment: >-
            Thank you for your contribution. Before it can be merged, please read
            the [Restow Contributor License Agreement](https://github.com/restow-backup/restow/blob/main/CLA.md)
            and agree to it by commenting on this pull request with exactly the
            sentence below. You only need to do this once.
          custom-pr-sign-comment: >-
            I have read the Restow Contributor License Agreement, version 1.0,
            and I agree to it for all my present and future contributions to Restow.
          custom-allsigned-prcomment: >-
            Every author of this pull request has agreed to the Restow Contributor
            License Agreement.
          lock-pullrequest-aftermerge: false

  dco:
    name: Developer Certificate of Origin
    # Dependabot's commits carry no sign-off (the CLA allowlist above names it for
    # the same reason). The PR author login is set by GitHub and cannot be faked.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the pull request with its history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every commit carries a Signed-off-by line
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$sha") has no Signed-off-by line."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off every commit with 'git commit -s' (Developer Certificate of Origin, see CONTRIBUTING.md)."
            exit 1
          fi
