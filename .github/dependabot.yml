# Dependabot version updates: weekly, grouped, with a low limit of open pull requests.
# Patch and minor updates arrive as a few grouped pull requests per ecosystem instead of
# one per package; known major migrations are ignored here and done by hand, one at a time
# (docs/STACK.md). Every pull request runs the normal CI, including the dependency license
# check (scripts/ci/check-licenses.mjs) and the audit.
#
# Dependabot pull requests are a to-do signal, not something to merge: their commits carry
# no DCO sign-off and they do not regenerate THIRD_PARTY_NOTICES.md. The update is redone in
# the development tree (with `node scripts/third-party-notices.mjs`), tested, shipped with the
# next release, and the bot pull request is closed (docs/CI.md, "Dependency licenses and
# Dependabot").
#
# Labels: Dependabot's own default names. If they do not exist in the repository
# yet, create them once (dependencies, javascript, go, github_actions, docker).
#
# Not covered by Dependabot, updated by hand: the images pinned by digest in
# the env block of .github/workflows/ci.yml (gitleaks, actionlint), the Go and
# restic pins in agent/tools.env, and scripts/smoke/e2e (playwright-core must
# match the pinned Playwright container image).
version: 2

updates:
  # The pnpm workspace (root package.json, apps/*, packages/*, ee/*, deploy/demo/seed).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 4
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # A dependency joins the first group that matches it.
    groups:
      # better-auth and its passkey plugin are released together and must move together.
      better-auth:
        patterns: ["better-auth", "@better-auth/*"]
        update-types: ["minor", "patch"]
      tanstack:
        patterns: ["@tanstack/*"]
        update-types: ["minor", "patch"]
      development:
        dependency-type: development
        update-types: ["minor", "patch"]
      production:
        dependency-type: production
        update-types: ["minor", "patch"]
    ignore:
      # The runtime is Node 22 LTS (docs/STACK.md); the type definitions follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Major migrations done by hand, each as its own change (docs/STACK.md):
      # vite (Rolldown, bundle smoke in a browser), vitest (config and mock semantics),
      # intl-messageformat (peer range of i18next-icu), archiver (API without default export).
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "intl-messageformat"
        update-types: ["version-update:semver-major"]
      - dependency-name: "archiver"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/archiver"
        update-types: ["version-update:semver-major"]

  # The endpoint agent (standard library only today, so this stays quiet until a
  # module is added; CI fails on a third-party module, see scripts/ci/check-go-deps.mjs).
  - package-ecosystem: gomod
    directory: "/agent"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # The product image and the updater test stubs.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/scripts/updater-e2e/stub"
      - "/scripts/updater-e2e/stub/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 2
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    groups:
      images:
        patterns: ["*"]
    ignore:
      # Node 22 LTS and PostgreSQL 16 are fixed choices (docs/STACK.md); a major
      # change of either is a decision, not an automatic update.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # The demo's Dovecot image. Its dovecot.conf is Dovecot 2.3 syntax; newer Alpine
  # releases may ship Dovecot 2.4, so the Alpine base moves by hand together with a
  # config check and a demo rebuild (deploy/demo/README.md), not automatically.
  - package-ecosystem: docker
    directory: "/deploy/demo/dovecot"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 1
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    ignore:
      - dependency-name: "alpine"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
