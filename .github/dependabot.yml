# Dependabot version updates: weekly, one pull request per update (no grouping).
# Every pull request runs the normal CI, including the dependency license check
# (scripts/ci/check-licenses.mjs) and the audit, so an update that brings in a
# license outside scripts/ci/license-policy.json cannot be merged.
#
# Labels: Dependabot's own default names. If they do not exist in the repository
# yet, create them once (dependencies, javascript, go, github_actions, docker).
#
# Not covered by Dependabot, updated by hand: the images pinned by digest in
# the env block of .github/workflows/ci.yml (gitleaks, actionlint), the Go and
# restic pins in agent/tools.env, and scripts/smoke/e2e (playwright-core must
# match the pinned Playwright container image).
version: 2

updates:
  # The pnpm workspace (root package.json, apps/*, packages/*, ee/*, deploy/demo/seed).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    ignore:
      # The runtime is Node 22 LTS (docs/STACK.md); the type definitions follow it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # The endpoint agent (standard library only today, so this stays quiet until a
  # module is added; CI fails on a third-party module, see scripts/ci/check-go-deps.mjs).
  - package-ecosystem: gomod
    directory: "/agent"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: "ci(deps)"

  # Every Dockerfile of the repository: the product image, the demo's Dovecot image
  # and the updater test stubs.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/deploy/demo/dovecot"
      - "/scripts/updater-e2e/stub"
      - "/scripts/updater-e2e/stub/web"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Node 22 LTS and PostgreSQL 16 are fixed choices (docs/STACK.md); a major
      # change of either is a decision, not an automatic update.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
