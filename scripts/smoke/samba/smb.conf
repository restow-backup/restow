# Samba of the release smoke (scripts/smoke/samba/Dockerfile). Standalone, SMB 3 only, NT ACLs
# in the `user.NTACL` extended attribute (vfs_acl_xattr; `user.` instead of the default
# `security.` so the container needs no extra capability), DOS attributes kept as xattrs.
[global]
  workgroup = SMOKE
  netbios name = SMOKESAMBA
  server role = standalone server
  security = user
  map to guest = never
  server min protocol = SMB3_00
  smb ports = 445
  disable netbios = yes
  load printers = no
  printing = bsd
  printcap name = /dev/null
  disable spoolss = yes
  log level = 1
  vfs objects = acl_xattr
  acl_xattr:security_acl_name = user.NTACL
  map acl inherit = yes
  store dos attributes = yes
  ea support = yes
  inherit acls = yes

[data]
  path = /srv/samba/data
  read only = no
  valid users = smoke
  create mask = 0664
  directory mask = 0775

[copy]
  path = /srv/samba/copy
  read only = no
  valid users = smoke
  create mask = 0664
  directory mask = 0775
